<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Novo Produto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Mesmo CSS do adicionar_estoque.html (copie o bloco :root e body acima) */
        :root { --yellow: #FFD400; --yellow-dark: #FFB300; --white: #FFFFFF; --black: #0A0A0A; --gray-light: #F5F5F5; --gray: #DDDDDD; --gray-dark: #666666; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, var(--white) 0%, var(--gray-light) 100%); color: var(--black); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .logo { display: inline-flex; align-items: center; gap: 12px; padding: 15px 25px; background: var(--white); border-radius: 12px; border: 2px solid var(--yellow); box-shadow: 0 5px 15px rgba(255, 212, 0, 0.15); margin-bottom: 20px; }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, var(--yellow), var(--yellow-dark)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 800; font-size: 1.5rem; }
        .logo-text { font-size: 1.8rem; font-weight: 700; color: var(--black); }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .form-container { background: var(--white); padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08); border: 2px solid var(--yellow); }
        label { display: block; margin: 20px 0 8px; font-weight: 600; }
        input, textarea { width: 100%; padding: 16px 20px; border: 2px solid var(--gray); border-radius: 10px; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(255, 212, 0, 0.2); }
        .btn { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--yellow), var(--yellow-dark)); border: none; border-radius: 10px; color: var(--white); font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn:hover { background: linear-gradient(135deg, var(--yellow-dark), var(--yellow)); transform: translateY(-2px); }
        .back-link { text-align: center; margin-top: 30px; }
        .back-link a { color: var(--black); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .small-hint { display: block; color: var(--gray-dark); font-size: 0.85rem; margin-top: 4px; font-weight: 400; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">SRG</div>
                <div class="logo-text">Gestão de Lojas</div>
            </div>
            <h1>Cadastrar Novo Produto</h1>
        </div>

        <div class="form-container">
            <form method="post">
                {% csrf_token %}
                <label>Nome do Produto *</label>
                <input type="text" name="nome" required>

                <label>Código/Barcode</label>
                <input type="text" name="codigo">

                <label>Descrição</label>
                <textarea name="descricao" rows="4"></textarea>

                <label>Preço de Custo *</label>
                <input type="number" step="0.01" name="preco_custo" required>

                <label>Preço de Venda *</label>
                <input type="number" step="0.01" name="preco_venda" required>

                <!-- ========== NOVO CAMPO: PREÇO A ATACADO ========== -->
                <label>Preço a Atacado (opcional)</label>
                <input type="number" step="0.01" name="preco_atacado" placeholder="Deixe em branco se não houver">
                <span class="small-hint">Preço para vendas em grandes quantidades. Deixe em branco se não quiser.</span>
                <!-- ================================================= -->

                <!-- ========== CAMPO DE QUANTIDADE INICIAL ========== -->
                <label>Quantidade inicial em estoque</label>
                <input type="number" name="quantidade_inicial" value="0" min="0" step="1">
                <span class="small-hint">Deixe 0 se não quiser adicionar estoque agora.</span>
                <!-- ================================================= -->

                <button type="submit" class="btn">
                    <i class="fas fa-save"></i> Salvar Produto
                </button>
            </form>

            <div class="back-link">
                <a href="{% url 'produtos:dashboard_gerente' loja_atual.slug %}">
                    <i class="fas fa-arrow-left"></i> Voltar ao Dashboard
                </a>
            </div>
        </div>
    </div>
</body>
</html>

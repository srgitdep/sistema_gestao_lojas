<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Dono - Escolher Loja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --yellow: #FFD400; --yellow-dark: #FFB300; --white: #FFFFFF; --black: #0A0A0A; --gray-light: #F5F5F5; }
        body { font-family: 'Poppins', sans-serif; background: var(--gray-light); color: var(--black); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        .header { margin-bottom: 40px; }
        .logo { display: inline-flex; align-items: center; gap: 12px; padding: 15px 25px; background: var(--white); border-radius: 12px; border: 2px solid var(--yellow); box-shadow: 0 5px 15px rgba(255, 212, 0, 0.15); }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, var(--yellow), var(--yellow-dark)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 800; font-size: 1.5rem; }
        .logo-text { font-size: 1.8rem; font-weight: 700; color: var(--black); }
        h1 { font-size: 2.2rem; color: var(--black); margin: 20px 0; }
        .lojas { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; margin: 50px 0; }
        .loja-card { background: var(--white); padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 320px; border: 2px solid var(--yellow); }
        .loja-card h2 { color: var(--yellow-dark); margin-bottom: 15px; }
        .loja-card a { display: block; padding: 18px; background: linear-gradient(135deg, var(--yellow), var(--yellow-dark)); color: var(--white); text-decoration: none; border-radius: 10px; font-weight: 700; margin-top: 15px; }
        .loja-card a:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,212,0,0.3); }
        .back-link { margin-bottom: 30px; }
        .back-link a { color: var(--black); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        
        

        <div class="header">
            <div class="logo">
                <div class="logo-icon">SRG</div>
                <div class="logo-text">Gestão de Lojas</div>
            </div>
            <h1>Modo Dono - Escolher Loja</h1>
            <p>Selecione a loja para ver o relatório financeiro completo</p>

            <div class="logout-btn">
            <a href="{% url 'logout' %}">
                <i class="fas fa-sign-out-alt"></i> Sair do Sistema
                </a>
            </div>
        </div>

        <div class="lojas">
            {% for loja in lojas %}
            <div class="loja-card">
                <h2>{{ loja.nome }}</h2>
                <p>Relatório financeiro detalhado</p>
                <a href="/loja/{{ loja.slug }}/relatorio/">Ver Relatório Financeiro</a>
            </div>
            {% empty %}
            <p>Nenhuma loja cadastrada.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher Loja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --yellow: #FFD400;
            --yellow-dark: #FFB300;
            --white: #FFFFFF;
            --black: #0A0A0A;
            --gray-light: #F5F5F5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--gray-light); color: var(--black); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        .header { margin-bottom: 40px; }
        .logo { display: inline-flex; align-items: center; gap: 12px; padding: 15px 25px; background: var(--white); border-radius: 12px; border: 2px solid var(--yellow); box-shadow: 0 5px 15px rgba(255, 212, 0, 0.15); }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, var(--yellow), var(--yellow-dark)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 800; font-size: 1.5rem; }
        .logo-text { font-size: 1.8rem; font-weight: 700; color: var(--black); }
        h1 { font-size: 2.5rem; margin: 30px 0; }
        .lojas { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; margin: 50px 0; }
        .loja-card {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 340px;
            border: 2px solid var(--yellow);
        }
        .loja-card h2 { color: var(--yellow-dark); margin-bottom: 20px; font-size: 1.8rem; }
        .loja-card a {
            display: block;
            padding: 18px;
            background: linear-gradient(135deg, var(--yellow), var(--yellow-dark));
            color: var(--white);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            margin: 10px 0;
        }
        .loja-card a:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,212,0,0.3); }
        .loja-card a.dono { background: linear-gradient(135deg, #666666, #444444); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">SRG</div>
                <div class="logo-text">Gestão de Lojas</div>
            </div>
            <h1>Escolher Loja</h1>
        </div>

        <div class="lojas">
            {% for loja in lojas %}
            <div class="loja-card">
                <h2>{{ loja.nome }}</h2>
                <a href="/loja/{{ loja.slug }}/">Entrar como Vendedor</a>
                <a href="/loja/{{ loja.slug }}/relatorio/" class="dono">Ver Relatório Financeiro (Dono)</a>
            </div>
            {% empty %}
            <p>Nenhuma loja cadastrada.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
